appId: com.proyect1.ATIDental
---
- launchApp

- runFlow: common/login-admin.yaml

# 4. Esperamos y tocamos la pestaña de Perfil
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 10000

- tapOn:
    id: "profile-tab"

# 5. Abrir el menú lateral
- extendedWaitUntil:
    visible:
      id: "menu-btn"
    timeout: 10000

- tapOn:
    id: "menu-btn"

# 6. Desplegar Administración
- extendedWaitUntil:
    visible:
      id: "nav-item-admin-toggle"
    timeout: 10000

- tapOn:
    id: "nav-item-admin-toggle"

# 7. Entrar a Reportes
- extendedWaitUntil:
    visible:
      id: "nav-item-admin-reports"
    timeout: 10000

- tapOn:
    id: "nav-item-admin-reports"

# 8. Abrir el modal de selección de tipo de reporte
- extendedWaitUntil:
    visible:
      id: "report-type-select"
    timeout: 15000

- tapOn:
    id: "report-type-select"

# 9. Seleccionar Tasa de Retención
- extendedWaitUntil:
    visible:
      id: "type-option-retention-rate"
    timeout: 10000

- tapOn:
    id: "type-option-retention-rate"

# 10. Validar componentes de Tasa de Retención
- extendedWaitUntil:
    visible:
      id: "kpi-cards-container"
    timeout: 10000

- assertVisible:
    id: "kpi-retention-day1"
- assertVisible:
    id: "kpi-retention-day1-val"
- assertVisible:
    id: "kpi-retention-day7"
- assertVisible:
    id: "kpi-retention-day7-val"
- assertVisible:
    id: "kpi-retention-day30"
- assertVisible:
    id: "kpi-retention-day30-val"
- assertVisible:
    id: "reports-retention-chart"

# 11. Cerrar sesión al finalizar
- extendedWaitUntil:
    visible:
      id: "menu-btn"
    timeout: 10000

- tapOn:
    id: "menu-btn"

- extendedWaitUntil:
    visible:
      id: "nav-item-logout"
    timeout: 10000

- tapOn:
    id: "nav-item-logout"
