appId: com.proyect1.ATIDental
---
- launchApp

# Esperar a que la app inicie y se quite la pantalla de carga (splash screen)
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# --- Inicio de Sesión Condicional ---
- runFlow:
    when:
      visible:
        id: "email-input"
    commands:
      - tapOn:
          id: "email-input"
      - inputText: "carloscaoucv2022@gmail.com"
      - tapOn:
          id: "password-input"
      - inputText: "Cao1234"
      - hideKeyboard
      - tapOn:
          id: "login-button"
      - extendedWaitUntil:
          visible:
            id: "welcome-header"
          timeout: 10000
# -----------------------------------

# Esperamos a que la app inicie (pantalla principal) y aparezca la barra de navegación
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 15000

# 1. Navegar al Perfil (donde se encuentra el botón de menú en la cabecera)
- tapOn:
    id: "profile-tab"

# Esperamos a que cargue la pantalla de perfil
- extendedWaitUntil:
    visible: ".*(Perfil|Profile).*"
    timeout: 5000

# 2. Escenario 4: Accesibilidad (Ubicable en el menú)
# Buscamos y presionamos el botón de menú en la cabecera (su testID es 'menu-btn')
- tapOn:
    id: "menu-btn"

# 2. Verificamos que cargó la pantalla de contactos
- assertVisible: ".*(Contacto|Contact).*"
- assertVisible: ".*(Responsables del Sitio|Site Responsibles).*"

# 3. Escenarios 1 y 2: Visualización de responsables dinámica
# Dado que es dinámico de Firestore, al menos debe mostrar las tarjetas
# Esperamos a que el ActivityIndicator termine buscando un ícono de email (común en las tarjetas)
- extendedWaitUntil:
    visible: ".*" 
    timeout: 5000

# Hacemos scroll hasta encontrar los textos clave traducidos
- scrollUntilVisible:
    element: ".*(Contacto Directo|Direct Contact).*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*(Actividad en Redes Sociales|Social Media Activity).*"
    direction: DOWN

# Probar la pulsación del botón de Email y validar el flujo alternativo
# Presiona el botón de contacto por Email
- tapOn:
    id: "btn-contact-email"
# Verifica que se muestre la alerta con la opción de copiar al portapapeles
- assertVisible: ".*Contacto por Email.*"
- assertVisible: ".*(Copiar al Portapapeles|COPIAR AL PORTAPAPELES).*"
# Presiona el botón para cerrar la alerta y regresar a la pantalla de contacto
- tapOn: "(Cerrar|CERRAR)"