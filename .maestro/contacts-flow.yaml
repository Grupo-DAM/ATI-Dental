appId: com.proyect1.ATIDental
---
- launchApp

# Esperar a que la app inicie y se quite la pantalla de carga (splash screen)
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000

# --- Inicio de Sesión ---
- tapOn:
    id: "email-input"
- inputText: "carloscaoucv2022@gmail.com"
- tapOn:
    id: "password-input"
- inputText: "Cao1234"
- hideKeyboard
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
        id: "welcome-header"
    timeout: 10000
# -----------------------------------

# Esperamos a que la app inicie (pantalla principal) y aparezca la barra de navegación
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 15000

# 1. Navegar al Perfil (donde se encuentra el botón de menú en la cabecera)
- tapOn:
    id: "profile-tab"

# Esperamos a que cargue la pantalla de perfil
- extendedWaitUntil:
    visible: ".*(Perfil|Profile).*"
    timeout: 5000

# 2. Abrir menú de navegación y entrar a Contacto
- tapOn:
    id: "menu-btn"

- extendedWaitUntil:
    visible:
      id: "nav-item-contact"
    timeout: 5000

- tapOn:
    id: "nav-item-contact"

# Verificamos que cargó la pantalla de contactos
- assertVisible: ".*(Contacto|Contact).*"
- assertVisible: ".*(Responsables del Sitio|Site Responsibles).*"

# 3. Escenarios 1 y 2: Visualización de responsables dinámica
# Dado que es dinámico de Firestore, al menos debe mostrar las tarjetas
# Esperamos a que el ActivityIndicator termine buscando un ícono de email (común en las tarjetas)
- extendedWaitUntil:
    visible: ".*" 
    timeout: 5000

# Hacemos scroll hasta encontrar los textos clave traducidos
- scrollUntilVisible:
    element: ".*(Contacto Directo|Direct Contact).*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*(Actividad en Redes Sociales|Social Media Activity).*"
    direction: DOWN

# -----------------------------------
# Probar la pulsación del botón de Email y validar el flujo alternativo
# Presiona el botón de contacto por Email
- tapOn:
    id: "btn-contact-email"

# Email app in device
- runFlow:
    when: 
        notVisible: ".*Contacto por Email.*"
    commands:
        # Conditional no email app configured for ATI-Dental
        - runFlow:
            when:
                visible: ".*(Abrir con|Open with).*"
            commands:
                - tapOn: "(Solo una vez|Just once)"

        - runFlow:
            when:
                notVisible: ".*Welcome to Gmail.*"
            commands:
                - assertVisible: "Consulta desde el sitio web"
                - hideKeyboard
        - back

# No email app in device branch
# Verifica que se muestre la alerta con la opción de copiar al portapapeles
- runFlow:
    when:
        visible: ".*Contacto por Email.*"
    commands:
        - assertVisible: ".*(Copiar al Portapapeles|COPIAR AL PORTAPAPELES).*"
        # Presiona el botón para cerrar la alerta y regresar a la pantalla de contacto
        - tapOn: "(Cerrar|CERRAR)"

# -----------------------------------
# Probar la pulsación del botón de Llamada y validar el flujo alternativo
# Presiona el botón de contacto por Llamada
- tapOn:
    id: "btn-contact-phone"

# Phone app in device
- runFlow:
    when: 
        notVisible: ".*Llamada Telefónica.*"
    commands:
        # Conditional no phone app configured for ATI-Dental
        - runFlow:
            when:
                visible: ".*(Abrir con|Open with).*"
            commands:
                - tapOn: "(Solo una vez|Just once)"

        - assertVisible: "\\+58.*"
        - back
        - back

# No phone app in device branch
# Verifica que se muestre la alerta con la opción de copiar al portapapeles
- runFlow:
    when:
        visible: ".*Llamada Telefónica.*"
    commands:
        - assertVisible: ".*(Copiar al Portapapeles|COPIAR AL PORTAPAPELES).*"
        # Presiona el botón para cerrar la alerta y regresar a la pantalla de contacto
        - tapOn: "(Cerrar|CERRAR)"


# -----------------------------------
# Probar la pulsación del botón de whatsapp y validar el flujo alternativo
# Presiona el botón de contacto por whatsapp
- tapOn:
    id: "btn-contact-whatsapp"

# Email app in device
- runFlow:
    when: 
        notVisible: ".*(Error|ERROR).*"
    commands:
        - assertVisible: ".*Hola.*"
        - back

        - runFlow:
            when:
                notVisible: 
                    id: "btn-contact-whatsapp"
            commands:
                - back

# No whatsapp app in device branch
- runFlow:
    when:
        visible: ".*(Error|ERROR).*"
    commands:
        - assertVisible: ".*(No se pudo abrir la aplicación de WhatsApp ni el navegador).*"
        # Presiona el botón para cerrar la alerta y regresar a la pantalla de contacto
        - tapOn: "(Cerrar|CERRAR)"

# -----------------------------------
- tapOn:
    id: "menu-btn"

- tapOn:
    id: "nav-item-logout"