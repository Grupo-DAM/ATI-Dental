appId: com.proyect1.ATIDental
---
# stopApp: false evita matar Expo (pantalla en blanco sin Metro).
- launchApp

- runFlow: common/login-admin.yaml

- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 10000

- tapOn:
    id: "profile-tab"

- extendedWaitUntil:
    visible:
      id: "menu-btn"
    timeout: 10000

- tapOn:
    id: "menu-btn"

- extendedWaitUntil:
    visible:
      id: "nav-item-admin-toggle"
    timeout: 10000

- tapOn:
    id: "nav-item-admin-toggle"

- extendedWaitUntil:
    visible:
      id: "nav-item-admin-reports"
    timeout: 10000

- tapOn:
    id: "nav-item-admin-reports"

- extendedWaitUntil:
    visible:
      id: "report-type-select"
    timeout: 15000

- tapOn:
    id: "report-type-select"

- extendedWaitUntil:
    visible:
      id: "type-option-demographics"
    timeout: 10000

- tapOn:
    id: "type-option-demographics"

- extendedWaitUntil:
    visible:
      id: "kpi-cards-container"
    timeout: 10000

- assertVisible:
    id: "kpi-total-users"
- assertVisible:
    id: "kpi-average-age"
- assertVisible:
    id: "reports-age-bar-chart"
- assertVisible:
    id: "reports-gender-donut-chart"

- scrollUntilVisible:
    element:
      id: "print-btn"
    direction: DOWN
    timeout: 15000
    speed: 60
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "print-btn"
- assertVisible:
    id: "export-pdf-btn"

- tapOn:
    id: "menu-btn"

- tapOn:
    id: "nav-item-logout"
