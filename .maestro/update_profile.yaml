appId: com.proyect1.ATIDental
---
- launchApp
- tapOn:
    id: "profile-button"

- extendedWaitUntil:
    visible: "Perfil e Idioma"
    timeout: 10000

# Validar Nombre Vacío
- tapOn:
    id: "input-name"
- eraseText
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- assertVisible: "El nombre no puede estar vacío"

# Restaurar Nombre
- tapOn:
   id: "input-name"
- inputText: "Valeria"

# Validar Apellido Vacío
- tapOn:
   id: "input-lastname"
- eraseText
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- assertVisible: "El apellido no puede estar vacío"

# Restaurar Apellido
- tapOn:
    id: "input-lastname"
- inputText: "Smith"

# Validar Correo Vacío
- tapOn:
    id: "input-email"
- eraseText
- tapOn:
    id: "input-email"
- eraseText
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- assertVisible: "El correo electrónico no puede estar vacío"

# Validar formato de correo invalido
- tapOn:
    id: "input-email"
- inputText: "correo-invalido"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- scrollUntilVisible:
    element:
      id: "input-email"
    direction: UP
    timeout: 10000
    speed: 40
- assertVisible: "Formato de correo inválido"

# Correo ya en uso
- tapOn:
    id: "input-email"
- eraseText
- inputText: "usado@atidental.com"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- assertVisible: "Este correo ya está registrado en otra cuenta."

# Caida de red
- tapOn:
    id: "input-email"
- eraseText
- tapOn:
    id: "input-email"
- eraseText
- inputText: "sinred@atidental.com"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- assertVisible: "Confirmación de Correo"
- tapOn:
    id: "btn-resend-link"
- assertVisible: "Sin conexión a internet. Intenta de nuevo."
- tapOn:
    id: "btn-close-modal"
- assertVisible: "No se realizaron cambios debido a un error previo."
- tapOn: "OK"

# Flujo exitoso
- tapOn:
    id: "input-email"
- eraseText
- tapOn:
    id: "input-email"
- eraseText
- inputText: "dr.nuevo@atidental.com"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "btn-save"
- assertVisible: "Confirmación de Correo"
- tapOn:
    id: "btn-close-modal"
- assertVisible: "Tu perfil y correo se han verificado y actualizado con éxito."
- tapOn: "OK"


