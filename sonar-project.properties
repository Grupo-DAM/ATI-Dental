# Required: identify your SonarCloud project and org
sonar.projectKey=Grupo-DAM_ATI-Dental
sonar.organization=grupo-dam

# SonarCloud endpoint
sonar.host.url=https://sonarcloud.io

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions for generated/dependency/tool content
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/.git/**,jest.setup.js,jest.config.js,jest.polyfill.js,check-env.js,scripts/**,tests/**,.maestro/**,.reassure/**

# Tests configuration
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/**/__test__/**,src/**/test-utils/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.perf-test.tsx
sonar.coverage.exclusions=src/**/test-utils/**,tests/**,**/*.perf-test.tsx
sonar.cpd.exclusions=src/**/test-utils/**,tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
