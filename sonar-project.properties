# Required: identify your SonarCloud project and org
sonar.projectKey=Grupo-DAM_ATI-Dental
sonar.organization=grupo-dam

# SonarCloud endpoint
sonar.host.url=https://sonarcloud.io

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions for generated/dependency content
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/.git/**,jest.setup.js,jest.config.js,scripts/**

# Tests configuration
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
