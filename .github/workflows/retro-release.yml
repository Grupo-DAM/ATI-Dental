name: 🛠️ Crear Releases para Tags Existentes (Temporal)

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Tag existente en GitHub (ej: v1.1.0)'
        required: true
      release_notes:
        description: 'Notas/Cambios para el cuerpo del Release'
        required: true
        default: 'Release histórico reconstruido de forma automática.'

jobs:
  build-and-release-past:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para publicar el Release sobre el Tag

    steps:
      - name: Checkout en el Tag existente 🕰️
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: |
          npm ci --ignore-scripts
          if [ -d "./node_modules/patch-package" ] || [ -f "./node_modules/.bin/patch-package" ]; then
            ./node_modules/.bin/patch-package
          fi

      # NUEVO: Inyectar la configuración de Firebase QA tal como lo hace el pipeline original
      - name: Inject QA Firebase Configuration
        env:
          FIREBASE_QA_BASE64: ${{ secrets.ANDROID_FIREBASE_QA_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_QA_BASE64" ]; then
            echo "::error::El secreto ANDROID_FIREBASE_QA_JSON_BASE64 no está configurado en GitHub."
            exit 1
          else
            echo "Decodificando e inyectando configuración de Firebase para QA..."
            echo "$FIREBASE_QA_BASE64" | base64 --decode > ./google-services.json
          fi

      - name: Configurar Expo y EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar APK en Expo Cloud ☁️
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Iniciando EAS Build utilizando el entorno del Tag..."
          eas build --platform android --profile preview --non-interactive

          echo "Extrayendo URL del APK generado..."
          APK_URL=$(eas build:list --platform android --limit 1 --json | jq -r '.. | .buildUrl? // empty')
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::No se pudo obtener la URL de descarga del APK."
            exit 1
          fi

          mkdir -p dist
          wget -O dist/ati-dental-${{ github.event.inputs.target_tag }}.apk "$APK_URL"
          echo "¡APK descargado con éxito!"

      - name: Publicar GitHub Release sobre el Tag Existente 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.target_tag }}
          name: Release ${{ github.event.inputs.target_tag }}
          body: |
            ### 📱 APK de la versión ${{ github.event.inputs.target_tag }}
            
            ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            dist/*.apk